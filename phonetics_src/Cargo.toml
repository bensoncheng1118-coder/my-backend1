[workspace]
resolver = "3"
members = ["crates/chimera", "crates/chimera-wasm", "crates/chimera-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
panic = "abort"
debug = false

[profile.dev]
opt-level = 1

[profile.test]
opt-level = 3
